<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Iniciar Sesión | Portal del Paciente NutriVida</title>
    <link rel="stylesheet" href="../assets/cs/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="../assets/js/login.js" defer></script>
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">
    <header style="position: relative; transform: none; transition: none">
      <nav class="navbar navbar-expand-md navbar-light bg-white shadow-sm py-3">
        <div class="container-fluid">
          <a href="../index.html" class="text-decoration-none">
            <span class="navbar-brand mb-0 h1 ms-2 text-success fw-bold"
              >NutriVida</span
            >
          </a>
          <div class="d-flex">
            <a href="../index.html" class="btn btn-outline-success btn-sm"
              >Volver al inicio</a
            >
          </div>
        </div>
      </nav>
    </header>

    <main class="container my-auto py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="bg-white p-5 rounded-4 shadow-sm border-0">
            <div class="text-center mb-4">
              <h2 class="fw-bold text-success">Iniciar Sesión</h2>
              <p class="text-muted">Accede a tu Portal del Paciente.</p>
            </div>

            <form action="#" method="POST" class="formulario">
              <div class="mb-3">
                <label for="loginEmail" class="form-label fw-semibold text-dark"
                  >Correo electrónico</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="loginEmail"
                  placeholder="tucorreo@email.com"
                  required
                />
              </div>
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                  <label
                    for="loginPassword"
                    class="form-label fw-semibold text-dark mb-0"
                    >Contraseña</label
                  >
                  <a href="#" class="text-success text-decoration-none small"
                    >¿Olvidaste tu contraseña?</a
                  >
                </div>
                <input
                  type="password"
                  class="form-control mt-2"
                  id="loginPassword"
                  placeholder="Ingresa tu contraseña"
                  required
                />
              </div>

              <div class="form-check mb-4">
                <input
                  class="form-check-input"
                  type="checkbox"
                  value=""
                  id="rememberMe"
                />
                <label
                  class="form-check-label text-muted small"
                  for="rememberMe"
                >
                  Mantener sesión iniciada
                </label>
              </div>

              <div class="d-grid mt-2">
                <button type="submit" class="btn btn-success btn-lg fw-bold">
                  Entrar a mi cuenta
                </button>
              </div>
              <div id="mensajeLogin"></div>

              <div class="text-center mt-4">
                <small class="text-muted"
                  >¿No tienes una cuenta?
                  <a
                    href="register.html"
                    class="text-success text-decoration-none fw-semibold"
                    >Regístrate aquí</a
                  ></small
                >
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-light py-4 text-center border-top mt-auto">
      <p class="text-muted mb-0">
        © 2026 NutriVida. Temuco, Región de La Araucanía. Todos los derechos
        reservados.
      </p>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
